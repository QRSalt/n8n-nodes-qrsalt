name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          # n8n itself declares engines.node >= 24, so the node is checked on
          # the runtime it will actually be loaded into.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # registry-url is left off deliberately: it makes setup-node write
      # `_authToken=${NODE_AUTH_TOKEN}`, which with no token becomes an empty
      # `_authToken=`. npm reads that as auth already configured, never starts
      # the OIDC exchange, and fails ENEEDAUTH.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: No empty auth token may shadow OIDC
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" 2>/dev/null || true

      # Trusted publishing needs npm 11.5.1; Node 24 already ships npm 11.
      - run: npm install -g npm@^11.5.1
      - run: npm --version

      # A tag that does not match the version in package.json would publish the
      # wrong number, or republish one npm already has and fail halfway.
      - name: The tag and package.json must agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged, package.json says $declared." >&2
            exit 1
          fi

      - run: npm ci

      # No NODE_AUTH_TOKEN: the only credential is the OIDC token this job
      # mints from id-token: write. prepack builds dist from this checkout.
      # --provenance is automatic under trusted publishing but kept explicit,
      # so a run that is somehow not using OIDC fails instead of shipping an
      # unsigned version that n8n verification would reject.
      - run: npm publish --provenance --access public

      - name: The published version must carry provenance
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3; do
            att="$(npm view "n8n-nodes-qrsalt@$version" dist.attestations --json 2>/dev/null || true)"
            if [ -n "$att" ] && [ "$att" != "null" ]; then
              echo "$att"
              exit 0
            fi
            echo "Attempt $attempt: registry has no attestation yet."
            sleep 10
          done
          echo "No provenance attestation on $version. It was published unsigned." >&2
          exit 1
